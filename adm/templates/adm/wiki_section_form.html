{% extends 'adm/base/base.html' %}
{% block title %}Sección del wiki{% endblock title %}
{% block body %}
<div class="container-fluid py-3">
    <h1>Sección del wiki</h1>
    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-cm">Guardar</button>
        <a href="{% url 'adm:wiki_sections' %}" class="btn btn-cm-cancel">Cancelar</a>
    </form>
</div>
{% endblock body %}
